services:
  aionshome:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./persistent/data:/app/aion-chat/data
      - ./persistent/wallpaper:/app/public/wallpaper
      - ./persistent/connor-uploads:/app/Connor-Codex/uploads
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/manifest.json', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s
